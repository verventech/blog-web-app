# Docker's DNS returns every replica address. A variable in proxy_pass
# makes nginx re-resolve, so --scale backend/frontend round-robins.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    
    # Internal metrics endpoint for nginx-prometheus-exporter
    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # Docker bridge subnets (where nginx-exporter connects from)
        allow 192.168.1.0/24;  # Internal LAN (Monitoring VM 192.168.1.7)
        deny all;
    }

    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        # A busy backend answers 503. Retrying that on the other replicas adds load.
        proxy_next_upstream error timeout http_502;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
